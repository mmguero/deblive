name: iso-build-wrap-push-ghcr
on:
  push:
    branches:
      - 'master'
    paths:
      - 'trixie/**'
  workflow_dispatch:
  repository_dispatch:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/deblive
  IMAGE_TAG: latest
  IMAGE_PLATFORM: linux/amd64
  REPO_CONTEXT: .
  REPO_CONTAINERFILE: ./docker/Dockerfile
concurrency:
  group: deblive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Build environment setup
        id: build-env-setup
        run: |
          sudo docker rmi $(docker image ls -aq) >/dev/null 2>&1 || true
          sudo rm -rf \
            "$AGENT_TOOLSDIRECTORY" \
            /opt/ghc \
            /usr/lib/jvm \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/swift >/dev/null 2>&1 || true
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -q -y update >/dev/null 2>&1
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -q -y --purge remove \
            azure-cli \
            dotnet* \
            firefox \
            google-chrome-stable \
            google-cloud-cli \
            microsoft-edge-stable \
            mono-* \
            mysql* \
            postgresql* \
            powershell \
            temurin*  >/dev/null 2>&1 || true
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -q -y --purge autoremove >/dev/null 2>&1 || true
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y -q \
               apt-transport-https \
               bc \
               build-essential \
               ca-certificates \
               curl \
               debhelper-compat \
               debootstrap \
               debian-archive-keyring \
               genisoimage \
               gettext \
               git \
               gnupg2 \
               jq \
               po4a \
               rsync \
               software-properties-common \
               squashfs-tools \
               xorriso \
               xz-utils
            git clone --depth=1 --single-branch --recurse-submodules --shallow-submodules --branch='debian/1%20250505+deb13u1' 'https://salsa.debian.org/live-team/live-build.git' /tmp/live-build
            cd /tmp/live-build
            sudo env DEBIAN_FRONTEND=noninteractive apt-get build-dep -y -q ./
            dpkg-buildpackage -b -uc -us
            sudo dpkg -i /tmp/live-build*.deb
      - name: Checkout
        id: repo-checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build ISO image
        id: build-iso-image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export IMAGE_DISTRIBUTION=trixie
          cat $IMAGE_DISTRIBUTION/vars.txt
          trap 'rm -f ./environment.chroot' EXIT
          ( umask 077 && printf 'GITHUB_TOKEN=%s\n' "$GITHUB_TOKEN" > ./environment.chroot )
          sudo /usr/bin/env bash ./build.sh "$IMAGE_DISTRIBUTION"
      - name: Log in to registry
        id: registry-login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push container image
        id: build-push-container-image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.REPO_CONTEXT }}
          file: ${{ env.REPO_CONTAINERFILE }}
          platforms: ${{ env.IMAGE_PLATFORM }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          push: true
          provenance: false
